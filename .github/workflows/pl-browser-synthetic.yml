name: PL synthetic browser regression
on:
  workflow_dispatch:
  push:
    paths:
      - '*.html'
      - '*.js'
      - '*.webmanifest'
      - 'site/**'
      - '.github/pl-ci/**'
      - '.github/workflows/pl-browser-synthetic.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.webmanifest'
      - 'site/**'
      - '.github/pl-ci/**'
      - '.github/workflows/pl-browser-synthetic.yml'
permissions:
  contents: read
jobs:
  chromium-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test-only browser runner
        run: npm install --no-save --no-audit --no-fund --prefix .github/pl-ci playwright@1.55.0
      - name: Install Chromium and OS dependencies
        run: .github/pl-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Run isolated real-browser checks
        run: node .github/pl-ci/run-browser-ci.cjs
      - name: Upload synthetic-only metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-synthetic-browser-result
          path: ${{ runner.temp }}/pl-synthetic-report/synthetic-results.json
          if-no-files-found: warn
          retention-days: 14
